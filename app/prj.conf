CONFIG_LOG=y
CONFIG_THREAD_NAME=y

# Equal-priority workers need timeslicing (or an explicit yield) so one
# thread can be preempted between reading and writing shared_count.
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=1

# Build-time switch:
#   y = mutex-protected
#   n = unprotected race demo
CONFIG_APP_USE_MUTEX=y
